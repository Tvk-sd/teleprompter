<title>Prompter</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0B0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    --ink: #0B0B0D;
    --ink-2: #16161A;
    --ink-3: #222228;
    --paper: #F3EFE6;
    --paper-dim: #8E8B83;
    --line: #34343B;
    --amber: #F5B942;
    --amber-soft: rgba(245, 185, 66, 0.16);
    --red: #FF5A4E;
    --red-soft: rgba(255, 90, 78, 0.18);
    --script: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", "SF Mono", Menlo, monospace;
    --size: 56px;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
    /* Reading band: as close to the front lens as the status bar allows. */
    --zone: calc(var(--sat) + 9dvh);
    --tap: 64px;
  }
  html, body { height: 100%; background: var(--ink); color: var(--paper); }
  body {
    font-family: var(--script);
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    -webkit-user-select: none; user-select: none;
  }
  textarea { -webkit-user-select: text; user-select: text; }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  button:disabled { opacity: 0.35; }
  [hidden] { display: none !important; }

  /* ---------- Edit screen ---------- */
  #edit {
    min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: calc(var(--sat) + 20px) calc(var(--sar) + 20px) calc(var(--sab) + 20px) calc(var(--sal) + 20px);
    gap: 14px;
    max-width: 720px; margin: 0 auto;
  }
  .brand { display: flex; align-items: baseline; justify-content: space-between; }
  .brand h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.02em; }
  .brand span { font-family: var(--mono); font-size: 13px; color: var(--paper-dim); letter-spacing: 0.08em; text-transform: uppercase; }
  textarea {
    flex: 1; min-height: 40vh;
    width: 100%; resize: none;
    background: var(--ink-2); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; font-size: 19px; line-height: 1.5;
    -webkit-appearance: none;
  }
  textarea::placeholder { color: var(--paper-dim); }
  .meta { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 14px; color: var(--paper-dim); letter-spacing: 0.04em; text-transform: uppercase; }
  .go {
    background: var(--amber); color: var(--ink);
    font-weight: 700; font-size: 22px; letter-spacing: 0.02em;
    border-radius: 16px; min-height: 72px; width: 100%;
  }
  .go:active { filter: brightness(0.92); }

  /* ---------- Prompt screen ---------- */
  #prompt { position: fixed; inset: 0; background: var(--ink); }
  #cam {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); background: var(--ink);
  }
  #dim { position: absolute; inset: 0; background: rgba(0,0,0,0.35); pointer-events: none; }
  #scroller {
    position: absolute; inset: 0;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #scroller::-webkit-scrollbar { display: none; }
  #scroller.mirror { transform: scaleX(-1); }
  #text {
    padding: var(--zone) calc(var(--sar) + 5vw) 80dvh calc(var(--sal) + 5vw);
    font-size: var(--size); line-height: 1.3; font-weight: 700;
    text-wrap: pretty; white-space: pre-wrap; word-break: break-word;
    max-width: 20ch; margin: 0 auto;
    transition: opacity 0.2s;
  }
  #text p { margin: 0 0 0.6em; }
  #prompt.camera #text { text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
  #prompt.camera #text p {
    background: rgba(11,11,13,0.72); padding: 0.08em 0.3em; border-radius: 0.18em;
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
  }
  #prompt.held #text { opacity: 0.45; }

  .zone {
    position: absolute; left: var(--sal); right: var(--sar); pointer-events: none;
    top: calc(var(--zone) - 0.2em);
    height: calc(var(--size) * 1.3 * 2.2);
    border-top: 3px solid var(--amber);
    border-bottom: 3px solid var(--amber);
    opacity: 0.8;
  }
  .zone::before { content: ""; position: absolute; left: 0; top: -6px; border: 9px solid transparent; border-left: 14px solid var(--amber); }
  .fade-top {
    position: absolute; left: 0; right: 0; top: 0; height: calc(var(--zone) - 0.2em);
    background: linear-gradient(var(--ink) 20%, rgba(11,11,13,0.9) 60%, rgba(11,11,13,0)); pointer-events: none;
  }
  #prompt.camera .fade-top { background: linear-gradient(rgba(11,11,13,0.6), rgba(11,11,13,0)); }

  /* Big status chip inside the band. Readable at arm's length. */
  #chip {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(var(--zone) - 0.2em - 46px);
    font-family: var(--mono); font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 6px 14px; border-radius: 999px; pointer-events: none; white-space: nowrap;
    background: rgba(11,11,13,0.8); color: var(--amber); border: 1px solid var(--amber);
    display: flex; gap: 10px; align-items: center;
  }
  #chip.rec { color: var(--red); border-color: var(--red); }
  #chip.rec::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--red); animation: blink 1s steps(2) infinite; }
  #chip.held::before { animation: none; }
  @keyframes blink { to { opacity: 0; } }
  #count {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(var(--zone) + 0.1em);
    font-size: calc(var(--size) * 1.6); font-weight: 700; color: var(--amber); pointer-events: none;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  }
  #hint {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 210px;
    font-size: 20px; color: var(--paper); background: rgba(11,11,13,0.85);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; pointer-events: none;
  }

  /* ---------- Controls ---------- */
  #hud {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 10px calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px);
    background: linear-gradient(rgba(11,11,13,0), rgba(11,11,13,0.94) 25%);
    display: grid; gap: 10px;
  }
  /* Rail: always on screen. */
  .rail { display: grid; grid-template-columns: var(--tap) 1fr var(--tap); gap: 10px; align-items: stretch; }
  .rail .stepper { grid-row: 1; }
  .rail .speed { grid-row: 1; display: grid; place-items: center; font-family: var(--mono); font-size: 20px; font-variant-numeric: tabular-nums; }
  .rail .speed small { display: block; font-size: 13px; color: var(--paper-dim); letter-spacing: 0.08em; text-transform: uppercase; }
  .primary { grid-row: 2; grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
  .btn {
    min-height: var(--tap); border-radius: 14px; font-size: 20px; font-weight: 700;
    background: var(--ink-3); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 0 12px;
  }
  .btn:active { filter: brightness(1.25); }
  .btn[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); background: var(--amber-soft); }
  .btn.run { background: var(--amber); color: var(--ink); border-color: var(--amber); }
  .btn.run.on { background: var(--amber-soft); color: var(--amber); }
  .btn.record { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .btn.record.on { background: var(--red); color: #fff; }
  .btn.record .dot { width: 18px; height: 18px; border-radius: 50%; background: currentColor; }
  .btn.record.on .dot { border-radius: 3px; }
  .btn .time { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500; }
  .btn.stepper { font-size: 30px; }
  /* Tray: only while nothing is moving. */
  .tray { display: grid; gap: 10px; }
  .tray .row { display: grid; grid-template-columns: 64px 1fr 72px; align-items: center; gap: 10px; }
  .tray label { font-family: var(--mono); font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--paper-dim); }
  .tray output { font-family: var(--mono); font-size: 17px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--amber); height: 44px; }
  .tray .btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tray .btn { min-height: 56px; font-size: 17px; }

  /* Landscape: lens is on one side. Column hugs that side. */
  @media (orientation: landscape) {
    :root { --zone: 12dvh; --tap: 56px; }
    #chip { left: auto; right: calc(var(--sar) + 12px); top: 10px; transform: none; }
    #text { max-width: 24ch; margin: 0 auto 0 calc(var(--sal) + 4vw); }
    #prompt.lens-right #text { margin: 0 calc(var(--sar) + 4vw) 0 auto; }
    #hud { grid-template-columns: 1fr 1fr; gap: 10px; }
    .rail { grid-column: 1; }
    .tray { grid-column: 2; }
    .tray .btns { grid-template-columns: repeat(5, 1fr); }
    #hint { bottom: 170px; }
  }
  @media (prefers-reduced-motion: reduce) { #chip.rec::before { animation: none; } #text { transition: none; } }
</style>

<main id="edit">
  <div class="brand">
    <h1>Prompter</h1>
    <span>Reads on iPhone</span>
  </div>
  <textarea id="script" placeholder="Paste or type your script here. One idea per line." spellcheck="false"></textarea>
  <div class="meta">
    <span id="words">0 words</span>
    <span id="est">~0:00 at current speed</span>
  </div>
  <button class="go" id="start">Open prompter</button>
</main>

<section id="prompt" hidden>
  <video id="cam" autoplay playsinline muted hidden></video>
  <div id="dim" hidden></div>
  <div id="scroller">
    <div id="text"></div>
  </div>
  <div class="fade-top"></div>
  <div class="zone"></div>
  <div id="chip">Ready</div>
  <div id="count" hidden>3</div>
  <div id="hint" hidden>Tap the words to hold. Tap again to go on.</div>

  <div id="hud">
    <div class="rail">
      <button class="btn stepper" id="slower" aria-label="Slower">−</button>
      <div class="speed"><span id="speedOut">120</span><small>words / min</small></div>
      <button class="btn stepper" id="faster" aria-label="Faster">+</button>
      <div class="primary">
        <button class="btn run" id="run">Run</button>
        <button class="btn record" id="record"><span class="dot"></span><span class="lbl">Record</span><span class="time" hidden>0:00</span></button>
      </div>
    </div>
    <div class="tray" id="tray">
      <div class="row">
        <label for="size">Size</label>
        <input type="range" id="size" min="36" max="110" step="2" value="56">
        <output id="sizeOut">56 px</output>
      </div>
      <div class="btns">
        <button class="btn" id="back">Edit</button>
        <button class="btn" id="restart">Top</button>
        <button class="btn" id="mirror" aria-pressed="false">Mirror</button>
        <button class="btn" id="camera" aria-pressed="false">Camera</button>
        <button class="btn" id="lens" hidden>Lens ◀</button>
      </div>
    </div>
  </div>
</section>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const SAMPLE = `Example script. Replace me.

Tap Run to start the words.
Tap the words to hold. Tap again to go on.

Tap Record to film yourself.
The camera comes on, you get three seconds, then the words and the recording start together.

Holding the words also holds the recording.
Tap Record again to stop and save the video.

The amber band is where your eyes stay.
It sits near the lens so you look at the camera.

Minus and plus change the speed while you read.
Size and Mirror live below.

Breathe. Look at the lens.`;

  const KEY = 'prompter.v2';
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}

  const ta = $('script'), size = $('size');
  const scroller = $('scroller'), text = $('text'), prompt = $('prompt'), chip = $('chip'), tray = $('tray');
  const cam = $('cam');
  ta.value = saved.text ?? SAMPLE;
  size.value = saved.size ?? 56;
  let speedPx = saved.speed ?? 56;           // px per second
  let lensRight = saved.lensRight ?? false;

  // ---- state ----
  // scrolling: words move.  rec: recorder exists.  held: rec paused by a tap.
  let scrolling = false, held = false, countingDown = false;
  let pos = 0, last = 0, raf = 0, wakeLock = null;
  let stream = null, recorder = null, chunks = [], recStart = 0, recElapsed = 0, recTimer = 0, autoStopTimer = 0;
  const recOn = () => recorder && recorder.state !== 'inactive';

  const words = () => (ta.value.trim().match(/\S+/g) || []).length;
  function wpm() {
    const h = text.scrollHeight - 0.89 * innerHeight;
    const w = words();
    if (h <= 0 || !w) return Math.round(speedPx * 2.1);
    return Math.round((speedPx / h) * w * 60);
  }
  function refreshLabels() {
    const w = words();
    $('words').textContent = `${w} word${w === 1 ? '' : 's'}`;
    const secs = wpm() ? Math.round(w / wpm() * 60) : 0;
    $('est').textContent = `~${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')} at current speed`;
    $('speedOut').textContent = wpm();
    $('sizeOut').textContent = `${size.value} px`;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ text: ta.value, speed: speedPx, size: +size.value, mirror: scroller.classList.contains('mirror'), lensRight, hinted: saved.hinted })); } catch (e) {}
  }
  function render() {
    text.innerHTML = '';
    ta.value.split(/\n{2,}/).forEach(chunk => {
      const p = document.createElement('p');
      p.textContent = chunk.trim();
      text.appendChild(p);
    });
    document.documentElement.style.setProperty('--size', size.value + 'px');
  }
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

  function paint() {
    // chip
    chip.classList.toggle('rec', recOn());
    chip.classList.toggle('held', held);
    if (recOn()) chip.textContent = held ? 'Rec held' : 'Rec';
    else chip.textContent = scrolling ? 'Rolling' : (held ? 'Held' : 'Ready');
    prompt.classList.toggle('held', held);
    // buttons
    $('run').textContent = scrolling ? 'Hold' : (held ? 'Go on' : 'Run');
    $('run').classList.toggle('on', scrolling);
    $('record').classList.toggle('on', recOn());
    $('record').querySelector('.lbl').textContent = recOn() ? 'Stop' : 'Record';
    $('record').querySelector('.time').hidden = !recOn();
    $('camera').disabled = recOn();
    $('back').disabled = recOn();
    // tray hides while the words move
    tray.hidden = scrolling;
  }

  // ---- scrolling ----
  function tick(now) {
    if (!scrolling) return;
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    pos += speedPx * dt;
    const max = scroller.scrollHeight - scroller.clientHeight;
    if (pos >= max) { pos = max; scroller.scrollTop = pos; endOfScript(); return; }
    scroller.scrollTop = pos;
    raf = requestAnimationFrame(tick);
  }
  function go() {
    if (scrolling) return;
    scrolling = true; held = false;
    pos = scroller.scrollTop; last = performance.now(); raf = requestAnimationFrame(tick);
    if (recOn() && recorder.state === 'paused') recorder.resume();
    paint();
  }
  function hold() {
    if (!scrolling) return;
    scrolling = false; held = true;
    cancelAnimationFrame(raf);
    if (recOn() && recorder.state === 'recording') { try { recorder.pause(); } catch (e) {} }
    paint();
  }
  function stopScroll() { scrolling = false; held = false; cancelAnimationFrame(raf); paint(); }
  function endOfScript() {
    hold();
    if (recOn()) { chip.textContent = 'End · saving in 3 s'; autoStopTimer = setTimeout(stopRecording, 3000); }
  }

  // Tap on the words = hold / go on. A drag scrubs instead.
  let tapStart = null;
  scroller.addEventListener('pointerdown', e => { tapStart = { x: e.clientX, y: e.clientY, t: Date.now() }; });
  scroller.addEventListener('pointerup', e => {
    if (!tapStart) return;
    const moved = Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y);
    const quick = Date.now() - tapStart.t < 400;
    tapStart = null;
    if (moved > 12 || !quick || countingDown) return;
    hideHint();
    scrolling ? hold() : go();
  });

  async function countdown() {
    countingDown = true;
    const c = $('count'); c.hidden = false;
    for (const n of [3, 2, 1]) { c.textContent = n; await new Promise(r => setTimeout(r, 700)); }
    c.hidden = true; countingDown = false;
  }
  async function keepAwake() { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {} }
  function showHint() { if (saved.hinted) return; $('hint').hidden = false; setTimeout(hideHint, 6000); }
  function hideHint() { $('hint').hidden = true; if (!saved.hinted) { saved.hinted = true; save(); } }

  // ---- camera ----
  async function cameraOn() {
    if (stream) return true;
    if (!navigator.mediaDevices?.getUserMedia) { alert('This browser cannot open the camera here.'); return false; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: true });
    } catch (err) {
      alert('Camera blocked: ' + err.name + '. Allow camera and microphone for this page, then try again.');
      return false;
    }
    cam.srcObject = stream; cam.hidden = false; $('dim').hidden = false;
    prompt.classList.add('camera'); $('camera').setAttribute('aria-pressed', 'true');
    return true;
  }
  function cameraOff() {
    if (!stream) return;
    stream.getTracks().forEach(t => t.stop()); stream = null;
    cam.srcObject = null; cam.hidden = true; $('dim').hidden = true;
    prompt.classList.remove('camera'); $('camera').setAttribute('aria-pressed', 'false');
  }

  // ---- recording ----
  const pickMime = () => ['video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(m => window.MediaRecorder?.isTypeSupported(m)) || '';
  async function startRecording() {
    if (!(await cameraOn())) return;
    chunks = [];
    const mimeType = pickMime();
    try { recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined); }
    catch (err) { alert('Recording not supported here: ' + err.message); recorder = null; return; }
    recorder.ondataavailable = ev => { if (ev.data.size) chunks.push(ev.data); };
    recorder.onstop = deliver;
    scroller.scrollTop = 0; pos = 0;
    await countdown();
    recorder.start(1000);
    recStart = Date.now(); recElapsed = 0;
    recTimer = setInterval(() => {
      if (recorder.state === 'recording') recElapsed = Math.round((Date.now() - recStart) / 1000);
      else recStart = Date.now() - recElapsed * 1000;
      $('record').querySelector('.time').textContent = fmt(recElapsed);
    }, 250);
    go();
  }
  function stopRecording() {
    clearTimeout(autoStopTimer);
    if (!recOn()) return;
    clearInterval(recTimer);
    recorder.stop();            // fires deliver()
    stopScroll();
  }
  async function deliver() {
    const type = recorder.mimeType || chunks[0]?.type || 'video/mp4';
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
    const filename = `prompter-${stamp}.${ext}`;
    const blob = new Blob(chunks, { type });
    const file = new File([blob], filename, { type });
    recorder = null; paint();
    if (navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Prompter recording' }); return; } catch (err) { if (err.name === 'AbortError') return; }
    }
    const downloads = await window.claude?.use?.('downloads');
    if (downloads) {
      try { await downloads.save({ filename, data: blob }); } catch (err) { if (err.code !== 'declined') alert('Could not save: ' + err.message); }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }

  // ---- lens side (landscape) ----
  function applyLens() {
    prompt.classList.toggle('lens-right', lensRight);
    $('lens').textContent = lensRight ? 'Lens ▶' : 'Lens ◀';
    $('lens').hidden = !matchMedia('(orientation: landscape)').matches;
  }
  function guessLens() {
    const t = screen.orientation?.type || '';
    if (t === 'landscape-primary') lensRight = false;     // iPhone: notch on the left
    if (t === 'landscape-secondary') lensRight = true;
    applyLens();
  }

  // ---- screens ----
  function openPrompter() {
    save(); render();
    $('edit').hidden = true; prompt.hidden = false;
    scroller.scrollTop = 0; pos = 0;
    refreshLabels(); keepAwake(); applyLens(); paint(); showHint();
  }
  function closePrompter() {
    if (recOn()) return;
    stopScroll(); cameraOff();
    prompt.hidden = true; $('edit').hidden = false;
    wakeLock?.release?.(); wakeLock = null;
    refreshLabels();
  }

  $('start').onclick = openPrompter;
  $('back').onclick = closePrompter;
  $('run').onclick = () => scrolling ? hold() : go();
  $('record').onclick = () => recOn() ? stopRecording() : startRecording();
  $('restart').onclick = () => { stopScroll(); scroller.scrollTop = 0; pos = 0; };
  $('slower').onclick = () => { speedPx = Math.max(8, speedPx - 6); refreshLabels(); save(); };
  $('faster').onclick = () => { speedPx = Math.min(200, speedPx + 6); refreshLabels(); save(); };
  $('camera').onclick = () => stream ? cameraOff() : cameraOn();
  $('lens').onclick = () => { lensRight = !lensRight; applyLens(); save(); };
  $('mirror').onclick = e => {
    const on = !scroller.classList.contains('mirror');
    scroller.classList.toggle('mirror', on);
    e.currentTarget.setAttribute('aria-pressed', on);
    save();
  };
  size.oninput = () => { render(); refreshLabels(); save(); };
  ta.oninput = () => { refreshLabels(); save(); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !prompt.hidden) keepAwake(); });
  document.addEventListener('keydown', e => {
    if (prompt.hidden) return;
    if (e.code === 'Space') { e.preventDefault(); scrolling ? hold() : go(); }
    if (e.key === 'Escape') closePrompter();
  });
  matchMedia('(orientation: landscape)').addEventListener('change', guessLens);
  screen.orientation?.addEventListener?.('change', guessLens);

  if (saved.mirror) { scroller.classList.add('mirror'); $('mirror').setAttribute('aria-pressed', 'true'); }
  render(); refreshLabels(); applyLens();
})();
</script>
