<title>Prompter</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0B0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Manrope:wght@500;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    --ink: #0B0B0D;
    --ink-2: #16161A;
    --paper: #FFFFFF;
    --paper-70: rgba(255,255,255,0.7);
    --paper-50: rgba(255,255,255,0.5);
    --glass: rgba(20,20,24,0.55);
    --glass-2: rgba(255,255,255,0.08);
    --edge: rgba(255,255,255,0.14);
    --red: #FF3B30;
    --script: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
    --ui: Manrope, -apple-system, "Helvetica Neue", sans-serif;
    --mono: "IBM Plex Mono", "SF Mono", Menlo, monospace;
    --size: 56px;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
    /* Reading band: as close to the front lens as the status bar allows. */
    --zone: calc(var(--sat) + 9dvh);
    --band-top: calc(var(--zone) - 4px);
    --band-h: calc(var(--size) * 1.3 * 2.2);
    /* Control sheet. Fixed height so nothing moves under the thumb. */
    --h-step: 56px; --h-primary: 76px; --h-icons: 40px; --gap: 10px; --pad: 12px;
    --sheet: calc(var(--h-step) + var(--h-primary) + var(--h-icons) + 2 * var(--gap) + 2 * var(--pad));
    --hud: calc(var(--sheet) + 14px);
  }
  html, body { height: 100%; background: var(--ink); color: var(--paper); }
  body {
    font-family: var(--ui);
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    -webkit-user-select: none; user-select: none;
  }
  textarea { -webkit-user-select: text; user-select: text; }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
  button:disabled { opacity: 0.3; }
  [hidden] { display: none !important; }

  /* ---------- Edit screen ---------- */
  #edit {
    min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: calc(var(--sat) + 20px) calc(var(--sar) + 20px) calc(var(--sab) + 20px) calc(var(--sal) + 20px);
    gap: 14px;
    max-width: 720px; margin: 0 auto;
  }
  .brand { display: flex; align-items: baseline; justify-content: space-between; }
  .brand h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
  .brand span { font-size: 13px; font-weight: 700; color: var(--paper-50); letter-spacing: 0.08em; text-transform: uppercase; }
  textarea {
    flex: 1; min-height: 36vh;
    width: 100%; resize: none;
    background: var(--ink-2); border: 1px solid var(--edge); border-radius: 22px;
    padding: 18px; font-size: 19px; line-height: 1.5; font-family: var(--script);
    -webkit-appearance: none;
  }
  textarea::placeholder { color: var(--paper-50); }
  .meta { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 13px; color: var(--paper-50); letter-spacing: 0.04em; text-transform: uppercase; }
  .setting { display: grid; grid-template-columns: 64px 1fr 72px; align-items: center; gap: 12px; }
  .setting label { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--paper-50); }
  .setting output { font-family: var(--mono); font-size: 17px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--paper); height: 44px; }
  .go {
    background: var(--paper); color: var(--ink);
    font-weight: 800; font-size: 20px; letter-spacing: 0.01em;
    border-radius: 999px; min-height: 72px; width: 100%;
  }
  .go:active { filter: brightness(0.9); }

  /* ---------- Prompt screen ---------- */
  #prompt { position: fixed; inset: 0; background: var(--ink); }
  #cam {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); background: var(--ink);
  }
  #dim { position: absolute; inset: 0; background: rgba(0,0,0,0.3); pointer-events: none; }
  #scroller {
    position: absolute; inset: 0;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #scroller::-webkit-scrollbar { display: none; }
  #scroller.mirror { transform: scaleX(-1); }
  #text {
    padding: var(--zone) calc(var(--sar) + 5vw) 80dvh calc(var(--sal) + 5vw);
    font-family: var(--script);
    font-size: var(--size); line-height: 1.3; font-weight: 700;
    text-wrap: pretty; white-space: pre-wrap; word-break: break-word;
    max-width: 20ch; margin: 0 auto;
    transition: opacity 0.2s;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  #text p { margin: 0 0 0.6em; }
  #prompt.camera #text p {
    background: rgba(0,0,0,0.38); padding: 0.06em 0.3em; border-radius: 0.2em;
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
  }
  #prompt.held #text { opacity: 0.4; }

  /* Reading band: a soft strip of light with a tick at the lens side. */
  .zone {
    position: absolute; left: 0; right: 0; pointer-events: none;
    top: var(--band-top); height: var(--band-h);
    background: linear-gradient(rgba(255,255,255,0) 0%, rgba(255,255,255,0.10) 25%, rgba(255,255,255,0.10) 75%, rgba(255,255,255,0) 100%);
  }
  .zone::before { content: ""; position: absolute; left: var(--sal); top: 30%; width: 4px; height: 40%; border-radius: 2px; background: var(--paper); }
  .fade-top {
    position: absolute; left: 0; right: 0; top: 0; height: var(--band-top);
    background: linear-gradient(var(--ink) 25%, rgba(11,11,13,0.85) 65%, rgba(11,11,13,0)); pointer-events: none;
  }
  #prompt.camera .fade-top { background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0)); }
  /* Words below the band step back. */
  .fade-bottom {
    position: absolute; left: 0; right: 0; bottom: 0; top: calc(var(--band-top) + var(--band-h)); pointer-events: none;
    background: linear-gradient(rgba(11,11,13,0.25), rgba(11,11,13,0.6) 60%);
  }

  /* Progress line under the status bar. */
  #progress {
    position: absolute; left: calc(var(--sal) + 20px); right: calc(var(--sar) + 20px); top: calc(var(--sat) + 6px);
    height: 3px; border-radius: 2px; background: rgba(255,255,255,0.22); pointer-events: none;
  }
  #progress i { display: block; width: 0; height: 100%; border-radius: 2px; background: var(--paper); transition: width 0.15s linear; }
  /* Status: one small word. */
  #chip {
    position: absolute; right: calc(var(--sar) + 20px); top: calc(var(--sat) + 16px);
    font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--paper-70); pointer-events: none; white-space: nowrap;
    display: flex; gap: 7px; align-items: center;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  #chip.rec { color: var(--red); }
  #chip.rec::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--red); animation: blink 1s steps(2) infinite; }
  #chip.held::before { animation: none; }
  @keyframes blink { to { opacity: 0; } }
  #count {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(var(--band-top) + 8px);
    font-family: var(--script); font-size: calc(var(--size) * 1.6); font-weight: 700; color: var(--paper); pointer-events: none;
    text-shadow: 0 2px 12px rgba(0,0,0,0.9);
  }
  #hint {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--sab) + var(--hud) + 12px);
    font-size: 17px; font-weight: 700; color: var(--paper); background: var(--glass);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--edge); border-radius: 999px; padding: 12px 20px; pointer-events: none;
    white-space: nowrap;
  }

  /* ---------- Controls: one frosted sheet ---------- */
  #hud {
    position: absolute; left: 12px; right: 12px; bottom: calc(var(--sab) + 14px);
    height: var(--sheet);
    padding: var(--pad);
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid var(--edge); border-radius: 30px;
    display: grid; gap: var(--gap);
    grid-template-rows: var(--h-icons) var(--h-primary) var(--h-step);
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }

  /* Row 1: tools as quiet text tabs. */
  .icons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; transition: opacity 0.2s; }
  .icons.ghost { opacity: 0.45; }
  .icons button {
    border-radius: 999px; font-size: 14px; font-weight: 800; color: var(--paper-70);
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .icons button:active { background: var(--glass-2); }
  .icons button[aria-pressed="true"] { color: var(--paper); }
  .icons button[aria-pressed="true"]::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 3px; height: 2px; border-radius: 1px; background: var(--paper); }
  .icons button .aa { font-family: var(--mono); font-size: 12px; opacity: 0.7; margin-left: 4px; }

  /* Row 2: two pills. Run is the white shutter; Record is a ghost pill with the red ring. */
  .primary { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
  .btn {
    border-radius: 999px; font-size: 19px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 0 12px;
  }
  .btn.run { background: var(--paper); color: var(--ink); }
  .btn.run:active { filter: brightness(0.9); }
  .btn.run[aria-pressed="true"] { background: var(--glass-2); color: var(--paper); border: 1.5px solid var(--edge); }
  .btn.record { background: var(--glass-2); color: var(--paper); border: 1.5px solid rgba(255,255,255,0.25); }
  .btn.record:active { background: rgba(255,255,255,0.14); }
  .btn.record[aria-pressed="true"] { background: var(--red); border-color: var(--red); }
  .btn.record .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--red); border: 3px solid var(--paper); box-sizing: border-box; }
  .btn.record[aria-pressed="true"] .dot { width: 18px; height: 18px; border-radius: 4px; background: var(--paper); border: 0; }
  .btn.record .time { font-family: var(--mono); font-size: 19px; font-variant-numeric: tabular-nums; font-weight: 500; }

  /* Row 3: the speed dial, one pill. */
  .group {
    display: grid; grid-template-columns: 56px 1fr 56px;
    border-radius: 999px; background: var(--glass-2);
  }
  .group button { font-size: 28px; font-weight: 500; color: var(--paper); border-radius: 999px; }
  .group button:active { background: rgba(255,255,255,0.14); }
  .group .speed { display: flex; align-items: baseline; justify-content: center; gap: 8px; font-family: var(--mono); font-size: 20px; font-variant-numeric: tabular-nums; align-self: center; }
  .group .speed small { font-family: var(--ui); font-size: 11px; font-weight: 800; color: var(--paper-50); letter-spacing: 0.12em; text-transform: uppercase; }

  /* Landscape: sheet sits on the non-lens half, two short rows. */
  @media (orientation: landscape) {
    :root { --zone: 12dvh; --h-step: 48px; --h-primary: 56px; --h-icons: 36px; --gap: 6px; --pad: 8px;
            --sheet: calc(var(--h-primary) + var(--h-icons) + var(--gap) + 2 * var(--pad)); --hud: calc(var(--sheet) + 10px); }
    #text { max-width: 24ch; margin: 0 auto 0 calc(var(--sal) + 4vw); }
    #prompt.lens-right #text { margin: 0 calc(var(--sar) + 4vw) 0 auto; }
    #prompt.lens-right .zone::before { left: auto; right: var(--sar); }
    #chip { top: 14px; }
    #prompt.lens-right #chip { right: auto; left: calc(var(--sal) + 20px); }
    #progress { top: 6px; }
    #hud {
      left: 50%; right: calc(var(--sar) + 10px); bottom: calc(var(--sab) + 10px);
      grid-template-rows: var(--h-icons) var(--h-primary); grid-template-columns: 1fr 1fr; border-radius: 24px;
    }
    #prompt.lens-right #hud { left: calc(var(--sal) + 10px); right: 50%; }
    .icons { grid-row: 1; grid-column: 1 / -1; grid-template-columns: repeat(6, 1fr); }
    .icons button { font-size: 13px; }
    .primary { grid-row: 2; grid-column: 2; }
    .btn { font-size: 17px; }
    .btn.record[aria-pressed="true"] .lbl { display: none; }
    .btn.record .time { font-size: 16px; }
    .group { grid-row: 2; grid-column: 1; grid-template-columns: 48px 1fr 48px; }
    .group .speed { font-size: 17px; } .group .speed small { display: none; }
    #hint { bottom: auto; top: calc(var(--band-top) + var(--size) * 3); }
  }
  @media (prefers-reduced-motion: reduce) { #chip.rec::before { animation: none; } #text, .icons, #progress i { transition: none; } }
</style>

<main id="edit">
  <div class="brand">
    <h1>Prompter</h1>
    <span>Reads on iPhone</span>
  </div>
  <textarea id="script" placeholder="Paste or type your script here. One idea per line." spellcheck="false"></textarea>
  <div class="meta">
    <span id="words">0 words</span>
    <span id="est">~0:00 at current speed</span>
  </div>
  <div class="setting">
    <label for="size">Size</label>
    <input type="range" id="size" min="36" max="110" step="2" value="56">
    <output id="sizeOut">56 px</output>
  </div>
  <button class="go" id="start">Open prompter</button>
</main>

<section id="prompt" hidden>
  <video id="cam" autoplay playsinline muted hidden></video>
  <div id="dim" hidden></div>
  <div id="scroller">
    <div id="text"></div>
  </div>
  <div class="fade-top"></div>
  <div class="fade-bottom"></div>
  <div class="zone"></div>
  <div id="progress"><i></i></div>
  <div id="chip" role="status" aria-live="polite">Ready</div>
  <div id="count" hidden>3</div>
  <div id="hint" hidden>Tap the words to hold. Tap again to go on.</div>

  <div id="hud">
    <div class="icons" id="icons">
      <button id="back">Edit</button>
      <button id="restart">Top</button>
      <button id="bigger">Aa<span class="aa" id="aaOut">56</span></button>
      <button id="mirror" aria-pressed="false">Mirror</button>
      <button id="preview" aria-pressed="false">Preview</button>
      <button id="lens" hidden>Lens ◀</button>
    </div>
    <div class="primary">
      <button class="btn run" id="run" aria-pressed="false">Run</button>
      <button class="btn record" id="record" aria-pressed="false"><span class="dot"></span><span class="lbl">Record</span><span class="time" hidden>0:00</span></button>
    </div>
    <div class="group">
      <button id="slower" aria-label="Slower">−</button>
      <div class="speed"><span id="speedOut">120</span><small>words / min</small></div>
      <button id="faster" aria-label="Faster">+</button>
    </div>
  </div>
</section>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const SAMPLE = `Example script. Replace me.

Tap Run to start the words.
Tap the words to hold. Tap again to go on.

Tap Record to film yourself.
The camera comes on, you get three seconds, then the words and the recording start together.

Holding the words also holds the recording.
Tap Stop to end and save the video.

The bright band is where your eyes stay.
It sits near the lens so you look at the camera.

Minus and plus change the speed while you read.
Aa cycles the text size. Mirror flips it for glass.

Breathe. Look at the lens.`;

  const KEY = 'prompter.v3';
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}

  const ta = $('script'), size = $('size');
  const scroller = $('scroller'), text = $('text'), prompt = $('prompt'), chip = $('chip'), icons = $('icons');
  const cam = $('cam');
  const SIZES = [44, 56, 68, 80, 96];
  ta.value = saved.text ?? SAMPLE;
  size.value = saved.size ?? 56;
  let targetWpm = saved.wpm ?? 130;         // the unit the user thinks in
  let speedPx = 56;                           // derived from targetWpm and the rendered text
  let lensRight = saved.lensRight ?? false;

  // ---- state ----
  // scrolling: words move.  held: paused by a tap (recording paused too).  countdown: 3-2-1 before a take.
  let scrolling = false, held = false, countdownAbort = null;
  let pos = 0, last = 0, raf = 0, wakeLock = null;
  let stream = null, recorder = null, chunks = [], recStart = 0, recElapsed = 0, recTimer = 0, autoStopTimer = 0;
  const recOn = () => recorder && recorder.state !== 'inactive';

  const words = () => (ta.value.trim().match(/\S+/g) || []).length;
  // px of scroll per word: the text's real height minus the empty lead-in and lead-out.
  const pxPerWord = () => {
    const h = text.scrollHeight - 0.89 * innerHeight, w = words();
    return h > 0 && w ? h / w : 0.45;
  };
  function applySpeed() { speedPx = targetWpm / 60 * pxPerWord(); }
  function refreshLabels() {
    const w = words();
    $('words').textContent = `${w} word${w === 1 ? '' : 's'}`;
    const secs = Math.round(w / targetWpm * 60);
    $('est').textContent = `~${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')} at ${targetWpm} wpm`;
    $('speedOut').textContent = targetWpm;
    $('sizeOut').textContent = `${size.value} px`;
    $('aaOut').textContent = size.value;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ text: ta.value, wpm: targetWpm, size: +size.value, mirror: scroller.classList.contains('mirror'), lensRight, hinted: saved.hinted })); } catch (e) {}
  }
  function render() {
    text.innerHTML = '';
    ta.value.split(/\n{2,}/).forEach(chunk => {
      const p = document.createElement('p');
      p.textContent = chunk.trim();
      text.appendChild(p);
    });
    document.documentElement.style.setProperty('--size', size.value + 'px');
    applySpeed();
  }
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  function progress() {
    const max = scroller.scrollHeight - scroller.clientHeight;
    $('progress').firstElementChild.style.width = (max > 0 ? Math.min(100, scroller.scrollTop / max * 100) : 0) + '%';
  }
  scroller.addEventListener('scroll', progress, { passive: true });

  function paint() {
    chip.classList.toggle('rec', recOn());
    chip.classList.toggle('held', held);
    if (countdownAbort) chip.textContent = 'Get ready';
    else if (recOn()) chip.textContent = held ? 'Rec held' : 'Rec';
    else chip.textContent = scrolling ? 'Rolling' : (held ? 'Held' : 'Ready');
    prompt.classList.toggle('held', held || !!countdownAbort);
    $('run').textContent = scrolling ? 'Hold' : (held ? 'Go on' : 'Run');
    $('run').setAttribute('aria-pressed', scrolling);
    $('run').disabled = !!countdownAbort;
    $('record').setAttribute('aria-pressed', recOn() || !!countdownAbort);
    $('record').querySelector('.lbl').textContent = countdownAbort ? 'Cancel' : (recOn() ? 'Stop' : 'Record');
    $('record').querySelector('.time').hidden = !recOn();
    $('back').disabled = recOn() || !!countdownAbort;
    $('preview').disabled = recOn() || !!countdownAbort;
    $('preview').setAttribute('aria-pressed', !!stream);
    icons.classList.toggle('ghost', scrolling);
  }

  // ---- scrolling ----
  function tick(now) {
    if (!scrolling) return;
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    pos += speedPx * dt;
    const max = scroller.scrollHeight - scroller.clientHeight;
    if (pos >= max) { pos = max; scroller.scrollTop = pos; progress(); endOfScript(); return; }
    scroller.scrollTop = pos; progress();
    raf = requestAnimationFrame(tick);
  }
  function go() {
    if (scrolling || countdownAbort) return;
    scrolling = true; held = false;
    pos = scroller.scrollTop; last = performance.now(); raf = requestAnimationFrame(tick);
    if (recOn() && recorder.state === 'paused') recorder.resume();
    paint();
  }
  function hold() {
    if (!scrolling) return;
    scrolling = false; held = true;
    cancelAnimationFrame(raf);
    if (recOn() && recorder.state === 'recording') { try { recorder.pause(); } catch (e) {} }
    paint();
  }
  function stopScroll() { scrolling = false; held = false; cancelAnimationFrame(raf); paint(); }
  function endOfScript() {
    hold();
    if (recOn()) { chip.textContent = 'End · saving'; autoStopTimer = setTimeout(stopRecording, 3000); }
  }

  // Tap on the words = hold / go on. A drag scrubs instead.
  let tapStart = null;
  scroller.addEventListener('pointerdown', e => { tapStart = { x: e.clientX, y: e.clientY, t: Date.now() }; });
  scroller.addEventListener('pointerup', e => {
    if (!tapStart) return;
    const moved = Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y);
    const quick = Date.now() - tapStart.t < 400;
    tapStart = null;
    if (moved > 12 || !quick || countdownAbort) return;
    hideHint();
    scrolling ? hold() : go();
  });

  // Countdown. Resolves true when it ran out, false when cancelled.
  function countdown() {
    return new Promise(res => {
      const c = $('count'); c.hidden = false;
      let n = 3, timer;
      const step = () => { c.textContent = n; if (n-- === 0) finish(true); else timer = setTimeout(step, 1000); };
      const finish = ok => { clearTimeout(timer); c.hidden = true; countdownAbort = null; res(ok); };
      countdownAbort = () => finish(false);
      step();
      paint();
    });
  }
  async function keepAwake() { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {} }
  function showHint() { if (saved.hinted) return; $('hint').hidden = false; setTimeout(hideHint, 6000); }
  function hideHint() { $('hint').hidden = true; if (!saved.hinted) { saved.hinted = true; save(); } }

  // ---- camera ----
  async function cameraOn() {
    if (stream) return true;
    if (!navigator.mediaDevices?.getUserMedia) { alert('This browser cannot open the camera here.'); return false; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: true });
    } catch (err) {
      alert('Camera blocked: ' + err.name + '. Allow camera and microphone for this page, then try again.');
      return false;
    }
    cam.srcObject = stream; cam.hidden = false; $('dim').hidden = false;
    prompt.classList.add('camera'); paint();
    return true;
  }
  function cameraOff() {
    if (!stream) return;
    stream.getTracks().forEach(t => t.stop()); stream = null;
    cam.srcObject = null; cam.hidden = true; $('dim').hidden = true;
    prompt.classList.remove('camera'); paint();
  }

  // ---- recording ----
  const pickMime = () => ['video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(m => window.MediaRecorder?.isTypeSupported(m)) || '';
  async function startRecording() {
    if (!(await cameraOn())) return;
    chunks = [];
    const mimeType = pickMime();
    let r;
    try { r = new MediaRecorder(stream, mimeType ? { mimeType } : undefined); }
    catch (err) { alert('Recording not supported here: ' + err.message); return; }
    stopScroll();
    scroller.scrollTop = 0; pos = 0;
    if (!(await countdown())) { paint(); return; }   // cancelled: no file
    recorder = r;
    recorder.ondataavailable = ev => { if (ev.data.size) chunks.push(ev.data); };
    recorder.onstop = deliver;
    recorder.start(1000);
    recStart = Date.now(); recElapsed = 0;
    recTimer = setInterval(() => {
      if (recorder?.state === 'recording') recElapsed = Math.round((Date.now() - recStart) / 1000);
      else recStart = Date.now() - recElapsed * 1000;
      $('record').querySelector('.time').textContent = fmt(recElapsed);
    }, 250);
    go();
  }
  function stopRecording() {
    clearTimeout(autoStopTimer);
    if (!recOn()) return;
    clearInterval(recTimer);
    recorder.stop();            // fires deliver()
    stopScroll();
  }
  async function deliver() {
    const type = recorder.mimeType || chunks[0]?.type || 'video/mp4';
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
    const filename = `prompter-${stamp}.${ext}`;
    const blob = new Blob(chunks, { type });
    const file = new File([blob], filename, { type });
    recorder = null; paint();
    if (navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Prompter recording' }); return; } catch (err) { if (err.name === 'AbortError') return; }
    }
    const downloads = await window.claude?.use?.('downloads');
    if (downloads) {
      try { await downloads.save({ filename, data: blob }); } catch (err) { if (err.code !== 'declined') alert('Could not save: ' + err.message); }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }

  // ---- speed: tap steps 5 wpm, hold repeats ----
  function stepSpeed(d) { targetWpm = Math.min(300, Math.max(40, targetWpm + d)); applySpeed(); refreshLabels(); save(); }
  function repeatOnHold(btn, d) {
    let t, i;
    const stop = () => { clearTimeout(t); clearInterval(i); };
    btn.addEventListener('pointerdown', e => { e.preventDefault(); stepSpeed(d); t = setTimeout(() => { i = setInterval(() => stepSpeed(d), 120); }, 400); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btn.addEventListener(ev, stop));
  }
  repeatOnHold($('slower'), -5);
  repeatOnHold($('faster'), 5);

  // ---- lens side (landscape) ----
  function applyLens() {
    prompt.classList.toggle('lens-right', lensRight);
    $('lens').textContent = lensRight ? 'Lens ▶' : 'Lens ◀';
    $('lens').hidden = !matchMedia('(orientation: landscape)').matches;
  }
  function guessLens() {
    const t = screen.orientation?.type || '';
    if (t === 'landscape-primary') lensRight = false;     // iPhone: notch on the left
    if (t === 'landscape-secondary') lensRight = true;
    applyLens(); applySpeed();
  }

  // ---- screens ----
  function openPrompter() {
    save(); render();
    $('edit').hidden = true; prompt.hidden = false;
    scroller.scrollTop = 0; pos = 0;
    applySpeed(); refreshLabels(); keepAwake(); applyLens(); paint(); showHint();
  }
  function closePrompter() {
    if (recOn() || countdownAbort) return;
    stopScroll(); cameraOff();
    prompt.hidden = true; $('edit').hidden = false;
    wakeLock?.release?.(); wakeLock = null;
    refreshLabels();
  }
  function setSize(v) {
    size.value = v;
    const ratio = scroller.scrollHeight ? scroller.scrollTop / scroller.scrollHeight : 0;
    render(); refreshLabels(); save();
    scroller.scrollTop = pos = ratio * scroller.scrollHeight;   // keep the place in the script
  }

  $('start').onclick = openPrompter;
  $('back').onclick = closePrompter;
  $('run').onclick = () => scrolling ? hold() : go();
  $('record').onclick = () => countdownAbort ? countdownAbort() : (recOn() ? stopRecording() : startRecording());
  $('restart').onclick = () => { stopScroll(); scroller.scrollTop = 0; pos = 0; };
  $('bigger').onclick = () => { const i = SIZES.findIndex(s => s > +size.value); setSize(i < 0 ? SIZES[0] : SIZES[i]); };
  $('lens').onclick = () => { lensRight = !lensRight; applyLens(); save(); };
  $('preview').onclick = () => stream ? cameraOff() : cameraOn();
  $('mirror').onclick = e => {
    const on = !scroller.classList.contains('mirror');
    scroller.classList.toggle('mirror', on);
    e.currentTarget.setAttribute('aria-pressed', on);
    save();
  };
  size.oninput = () => { render(); refreshLabels(); save(); };
  ta.oninput = () => { refreshLabels(); save(); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !prompt.hidden) keepAwake(); });
  document.addEventListener('keydown', e => {
    if (prompt.hidden) return;
    if (e.code === 'Space') { e.preventDefault(); scrolling ? hold() : go(); }
    if (e.key === 'Escape') closePrompter();
  });
  matchMedia('(orientation: landscape)').addEventListener('change', guessLens);
  screen.orientation?.addEventListener?.('change', guessLens);
  addEventListener('resize', applySpeed);

  if (saved.mirror) { scroller.classList.add('mirror'); $('mirror').setAttribute('aria-pressed', 'true'); }
  render(); refreshLabels(); applyLens();
})();
</script>
